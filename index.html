<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="start-screen">
    <div class="start-card">
      <div class="logo">⬢</div>
      <h1>Catan</h1>
      <p class="tagline">Settle the island. Trade, build and outsmart the bots.</p>
      <form id="start-form" autocomplete="off">
        <label class="field">
          <span>Your name</span>
          <input name="name" value="You" maxlength="16">
        </label>
        <div class="field">
          <span>Your color</span>
          <div id="color-pick" class="color-pick"></div>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Opponents</span>
            <select name="bots">
              <option value="2">2 bots</option>
              <option value="3" selected>3 bots</option>
            </select>
          </label>
          <label class="field">
            <span>Points to win</span>
            <select name="vp">
              <option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
            </select>
          </label>
          <label class="field">
            <span>Bot speed</span>
            <select name="speed">
              <option value="slow">Slow</option>
              <option value="normal" selected>Normal</option>
              <option value="fast">Fast</option>
              <option value="instant">Instant</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Bot type</span>
          <select name="brain">
            <option value="classic">Classic (hand-written rules)</option>
            <option value="neural">Neural network (trained with RL)</option>
            <option value="mixed">Mixed: neural and classic</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" name="friendly">
          <span>Friendly robber <small>— the robber can't target players with 2 or fewer points</small></span>
        </label>
        <button type="submit" class="btn primary big">Start game</button>
      </form>
    </div>
  </div>

  <div id="game" class="hidden">
    <main id="board-area">
      <div id="banner"></div>
      <svg id="board" viewBox="-340 -300 680 600" preserveAspectRatio="xMidYMid meet" aria-label="Game board"></svg>
      <div id="dice"></div>
      <div id="toast" role="status"></div>
    </main>
    <aside id="sidebar">
      <section id="log-panel">
        <h2>Game log</h2>
        <div id="log"></div>
      </section>
      <section id="players"></section>
      <section id="bank"></section>
      <details id="costs">
        <summary>Building costs</summary>
        <div class="cost-row"><span>Road</span><span class="mini-card res-wood">🌲</span><span class="mini-card res-brick">🧱</span></div>
        <div class="cost-row"><span>Settlement</span><span class="mini-card res-wood">🌲</span><span class="mini-card res-brick">🧱</span><span class="mini-card res-sheep">🐑</span><span class="mini-card res-wheat">🌾</span></div>
        <div class="cost-row"><span>City</span><span class="mini-card res-wheat">🌾</span><span class="mini-card res-wheat">🌾</span><span class="mini-card res-ore">⛰️</span><span class="mini-card res-ore">⛰️</span><span class="mini-card res-ore">⛰️</span></div>
        <div class="cost-row"><span>Dev card</span><span class="mini-card res-sheep">🐑</span><span class="mini-card res-wheat">🌾</span><span class="mini-card res-ore">⛰️</span></div>
      </details>
    </aside>
    <footer id="hud">
      <div id="hand"></div>
      <div id="actions"></div>
    </footer>
  </div>

  <div id="modal-root"></div>

  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="rl/encoding.js"></script>
  <script src="rl/nn.js"></script>
  <script src="rl/agent.js"></script>
  <script src="models/catan-policy.js" onerror="this.remove()"></script>
  <script src="js/controller.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
